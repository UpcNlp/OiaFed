exp_name: fedsra_cifar10_dcu_smoke

trainer:
  device: cuda
  fit_timeout: 600
  eval_batch_size: 128
  eval_num_workers: 2
  feature_dim: 64

learner:
  device: cuda
  batch_size: 64
  num_workers: 2
  persistent_workers: true
  drop_last: true
  use_bf16: true
  feature_dim: 64
  checkpoint_dir: ${FEDSRA_CHECKPOINT_DIR}
  resume: true

model:
  feature_dim: 64

dataset:
  data_dir: /public/home/dongshou/data
  download: true
  server_test: true
  transform_profile: fedsra
  max_samples: 512
  subset_seed: 2027
  partition:
    strategy: fedsra_dirichlet
    alpha: 0.5
    seed: 42

logging:
  console: true
  level: INFO

tracker:
  enabled: false
