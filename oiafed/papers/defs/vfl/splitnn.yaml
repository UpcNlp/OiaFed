# ==================== SplitNN: Split Learning for VFL ====================
# MIT Media Lab, 2018
# Paper: https://arxiv.org/abs/1812.00564

id: splitnn
name: "SplitNN: Split Learning for Vertical Federated Learning"
category: VFL
venue: "MIT Media Lab"
year: 2018
url: "https://arxiv.org/abs/1812.00564"
description: |
  模型垂直分割的联邦学习方法。
  客户端持有模型前几层 (client_layers)，服务端持有后几层 (server_layers)。
  每个 batch: client forward → 发送激活 → server forward+backward → 返回梯度 → client backward。
  只传输中间激活值 (smashed data)，保护原始数据隐私。

# ==================== 组件映射 ====================
components:
  learner: vfl.splitnn
  aggregator: fedavg                # SplitNN 不做权重聚合, 但框架要求有 aggregator
  trainer: splitnntrainer           # VFL 专用 trainer (注意: registry 全小写)
  model: cifar10_cnn
  dataset: cifar10

# ==================== 默认参数 ====================
defaults:
  experiment:
    num_clients: 2

  trainer:
    num_rounds: 10
    local_epochs: 1
    client_fraction: 1.0
    eval_interval: 2
    split_layer: 2                  # 在第 2 层后切分 (卷积 → 全连接之间)
    learning_rate: 0.01             # server 端学习率
    batch_size: 64

  learner:
    split_layer: 2
    learning_rate: 0.01
    batch_size: 64
    momentum: 0.9
    weight_decay: 0.0005

  aggregator:
    weighted: true

  model:
    num_classes: 10

  dataset:
    data_dir: ./data
    download: true
    partition:
      strategy: iid

# ==================== 可调参数说明 ====================
params:
  learner.split_layer:
    type: int
    range: [1, 10]
    desc: "模型切分位置 (层索引)"

  learner.learning_rate:
    type: float
    range: [0.0001, 0.1]
    desc: "client 端学习率"

  trainer.learning_rate:
    type: float
    range: [0.0001, 0.1]
    desc: "server 端学习率"

  trainer.num_rounds:
    type: int
    range: [1, 100]
    desc: "训练轮数"

  experiment.num_clients:
    type: int
    range: [2, 10]
    desc: "客户端数量 (VFL 通常为 2)"

# ==================== 引用信息 ====================
citation: |
  @article{splitnn2018,
    title={Split Learning for Health: Distributed Deep Learning without Sharing Raw Data},
    author={Vepakomma, Praneeth and Gupta, Otkrist and Swedish, Tristan and Raskar, Ramesh},
    journal={arXiv preprint arXiv:1812.00564},
    year={2018}
  }

notes: |
  - VFL 训练流程与 HFL 完全不同: 每个 batch 需要 client↔server 交互
  - 不做 FedAvg 聚合, 模型通过 split training 直接更新
  - split_layer 决定客户端和服务端的分割点, 对于 CNN 建议设为卷积层数量
  - 通信量 = 每个 batch 的激活值 + 梯度 (比 HFL 通信更频繁但更小)
