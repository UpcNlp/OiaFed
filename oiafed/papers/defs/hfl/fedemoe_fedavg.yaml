id: fedemoe_fedavg
name: "FedAvg (FedEMoE comparison implementation)"
category: HFL
venue: "FedEMoE comparison suite"
year: 2026
url: "https://github.com/Stephen-Chow1/FedEMoE-CEGA"
description: "The exact FedAvg implementation used by the FedEMoE artifact."
components: {learner: fedemoe_fedavg, aggregator: fedemoe_fedavg, trainer: fedemoe_fedavg, model: fedemoe_baseline, dataset: cifar10}
defaults:
  experiment: {num_clients: 100}
  trainer: &trainer {num_rounds: 500, local_epochs: 5, clients_per_round: 10, client_fraction: 0.1, eval_interval: 10, seed: 42, device: cuda, batch_size: 64, num_workers: 4, eval_batch_size: 64, eval_num_workers: 4}
  learner: &learner {learning_rate: 0.01, batch_size: 64, momentum: 0.9, weight_decay: 0.0001, optimizer: sgd, num_classes: 10, num_workers: 4, device: cuda}
  aggregator: &aggregator {num_classes: 10, backbone: cnn, input_channels: 3, input_size: 32, hidden_dim: 256, device: cuda}
  model: &model {num_classes: 10, backbone: cnn, input_channels: 3, input_size: 32, hidden_dim: 256, dropout: 0.1, seed: 42}
  dataset: &dataset {data_dir: ./data, download: true, server_test: true, learner_test: false, shared_cache: true, augmentation: false, transform_profile: fedemoe, partition: {strategy: fedemoe_dirichlet, alpha: 0.5, seed: 42}}
notes: "Distinct from OiaFed's built-in FedAvg; this entry preserves the comparison artifact implementation."

