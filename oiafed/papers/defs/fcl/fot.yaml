# ==================== FOT: Federated Orthogonal Training ====================
# ICLR 2024 — Bakman et al.
# Official code: https://github.com/duygunuryldz/Federated_Orthogonal_Training

id: fot
name: "FOT: Federated Orthogonal Training (ICLR 2024)"
category: FCL
venue: "ICLR 2024"
year: 2024
url: "https://arxiv.org/abs/2309.01289"
description: |
  使用正交投影防止灾难性遗忘的联邦持续学习方法。
  核心思想:
  1. GPSE: 任务结束时提取全局主子空间 (SVD)
  2. FedProject: 在服务端将聚合更新投影到旧任务子空间的正交补空间
  客户端无额外计算开销。

# ==================== 组件映射 ====================
components:
  learner: cl.fot
  aggregator: fedproject          # 关键: 使用 FedProject 聚合器, 不是 FedAvg!
  trainer: fotcontinual           # 关键: 使用 FOT 专用 trainer, 支持 GPSE 轮次!
  model: fot_alexnet              # 关键: 多头模型 + 激活捕获!
  dataset: cifar10

# ==================== 默认参数 ====================
defaults:
  experiment:
    num_clients: 3

  trainer:
    num_rounds: 20
    num_tasks: 5
    rounds_per_task: 4
    local_epochs: 3
    client_fraction: 1.0
    eval_interval: 2

  learner:
    learning_rate: 0.01
    batch_size: 32
    weight_decay: 0.00001
    # FOT CL 参数
    num_tasks: 5
    classes_per_task: 2

  aggregator:
    weighted: true
    # FedProject 参数
    epsilon: 0.87
    eps_inc: 0.0
    orth_layer_names:
      - conv1.weight
      - conv2.weight
      - conv3.weight
      - fc1.weight
      - fc2.weight

  model:
    num_classes: 2       # 每个任务头的类别数
    task_num: 5          # 任务总数 (多头)

  dataset:
    data_dir: ./data
    download: true
    partition:
      strategy: dirichlet
      alpha: 0.5

# ==================== 可调参数说明 ====================
params:
  learner.learning_rate:
    type: float
    range: [0.00001, 1.0]
    desc: "学习率"

  learner.batch_size:
    type: int
    choices: [16, 32, 64, 128]
    desc: "批大小"

  aggregator.epsilon:
    type: float
    range: [0.5, 0.99]
    desc: "SVD 能量保留比例 (越大防遗忘越强, 但新任务学习空间越小)"

  aggregator.eps_inc:
    type: float
    range: [0.0, 0.05]
    desc: "每个任务后 epsilon 的增量"

  trainer.rounds_per_task:
    type: int
    range: [1, 50]
    desc: "每个任务的训练轮数"

  trainer.local_epochs:
    type: int
    range: [1, 20]
    desc: "本地训练轮数"

  experiment.num_clients:
    type: int
    range: [2, 100]
    desc: "客户端数量"

  dataset.partition.alpha:
    type: float
    range: [0.1, 100.0]
    desc: "Dirichlet 分布参数 (越小数据越异构)"

# ==================== 引用信息 ====================
citation: |
  @inproceedings{bakman2024federated,
    title={Federated Orthogonal Training: Mitigating Global Catastrophic Forgetting in Continual Federated Learning},
    author={Bakman, Yavuz Faruk and Yildiz, Duygu Nur and Akyildiz, Huseyin and Kozat, Suleiman},
    booktitle={International Conference on Learning Representations (ICLR)},
    year={2024}
  }

# ==================== 备注 ====================
notes: |
  - 使用多头模型 (每个任务独立分类头), 不是单头 class-incremental
  - 客户端无额外计算: 标准 SGD 训练
  - 正交投影在 SERVER 端的 FedProject 聚合器中完成
  - GPSE 在每个任务结束时执行一次 (额外通信轮)
  - epsilon 越大, 防遗忘效果越好, 但可能限制新任务学习能力
  - 官方代码 Split-CIFAR100: epsilon=0.87, 8 clients, AlexNet