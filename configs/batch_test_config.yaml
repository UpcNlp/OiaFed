# =============================================================================
# 批量测试配置示例
# 
# 使用方法:
#   oiafed run --paper fedavg -n 10 --config batch_test_config.yaml
#   oiafed run --paper moon -n 5 --config batch_test_config.yaml
#   oiafed run --paper scaffold -n 10 --config batch_test_config.yaml --dry-run
#
# exp_name 会自动生成为: {algorithm}_{dataset}_{partition}
# 例如: fedavg_cifar10_dir_0.3, moon_cifar10_dir_0.3
# =============================================================================

# 数据集配置
# dataset:
#   data_dir: ./data
#   partition:
#     strategy: dirichlet      # iid | dirichlet | label_skew | quantity_skew
#     alpha: 0.3               # Dirichlet alpha 参数（越小越异构）
#     # num_labels_per_client: 2  # label_skew 时使用
#     # imbalance_ratio: 0.5      # quantity_skew 时使用

# 训练参数
trainer:
  num_rounds: 50
  local_epochs: 5

learner:
  learning_rate: 0.01
  batch_size: 64

# MLflow 追踪配置
tracker:
  enabled: true
  backends:
    - type: mlflow
      args:
        experiment_name: HFL
        tracking_uri: ${MLFLOW_TRACKING_URI:http://172.19.138.200:5000}
        auto_start_run: true
        auto_end_run: true
        username: ${MLFLOW_TRACKING_USERNAME:dongshou}
        password: ${MLFLOW_TRACKING_PASSWORD:admin123admin}

# 日志配置
logging:
  level: INFO
  console: true

# 如果需要手动指定实验名称，取消注释下面这行
# exp_name: my_custom_experiment_name

# 随机种子
seed: 42