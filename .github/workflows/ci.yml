# GitHub Actions 工作流：持续集成
#
# 触发条件：
# 1. 推送到 main/master 分支
# 2. Pull Request 到 main/master 分支

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # 代码质量检查（允许失败）
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # 允许失败，不阻塞后续步骤
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check formatting with black
        run: black --check --diff oiafed/ || echo "Black check failed (non-blocking)"

      - name: Check imports with isort
        run: isort --check-only --diff oiafed/ || echo "isort check failed (non-blocking)"

      - name: Lint with flake8
        run: flake8 oiafed/ --max-line-length=100 --ignore=E501,W503,E203,E402,F401 || echo "flake8 check failed (non-blocking)"

  # 构建测试（不依赖 lint）
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Test install
        run: |
          pip install dist/*.whl
          python -c "import oiafed; print(f'OiaFed version: {oiafed.__version__}')"